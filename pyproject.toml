[project]
name = "ko-judge-lora"
version = "0.1.0"
description = "한국어 LLM 평가자(judge) LoRA: KUDGE 사람 점수 일치도·모델 순위 재현, AWQ 4bit 전후, vLLM 비용"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 학습·병합·양자화 환경 (CUDA). 정확한 고정 버전은 requirements/train.txt
train = [
    "torch>=2.10,<=2.14.0",
    "transformers>=5.15,<=5.17.0",
    "peft>=0.21",
    "trl>=1.14",
    "accelerate>=1.15",
    "datasets>=4.8.4",
    "llmcompressor>=0.14",
]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: 작은 랜덤 모델로 학습 경로만 확인 (torch 필요, 네트워크 불필요)",
    "data: 내려받은 KUDGE가 있어야 하는 테스트",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Kaggle 커널 원본: 실행한 그대로 둔다
extend-exclude = ["docs/kaggle_t4"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# vLLM이 모든 프로세스에서 불러오는 플러그인: kanana 설정 검증 우회 (ko_judge/compat.py)
[project.entry-points."vllm.general_plugins"]
ko_judge_compat = "ko_judge.compat:register"

[tool.ruff.lint.per-file-ignores]
# 보고서 렌더러: 마크다운 표 문자열을 한 줄로 둔다
"src/ko_judge/profile.py" = ["E501"]
"src/ko_judge/budget.py" = ["E501"]
